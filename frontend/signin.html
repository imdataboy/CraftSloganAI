<style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 90px;
        }


/* Container Split for Desktop */
.split-container {
    display: flex;
    flex-direction: row;
    min-height: 100vh;
}

/* Left Panel Styling */
.left-panel {
    flex: 1;
    background-color: #f4f4f9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 50px;
}

.left-panel h1 {
    font-size: 4rem;
    font-weight: 700;
    color: #333;
    margin-bottom: 20px;
}

.left-panel img {
    max-width: 100%;
    height: auto;
    margin-top: 20px;
}

/* Right Panel Styling */
.right-panel {
    flex: 1;
    background-color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
}

.login-wrapper {
    width: 100%;
    max-width: 400px;
}

.login-wrapper h3 {
    font-size: 2rem;
    font-weight: 700;
    color: #333;
    margin-bottom: 30px;
}

/* Buttons and Form Controls */
.form-control {
    border-radius: 5px;
    padding: 12px 15px;
    font-size: 1rem;
    margin-bottom: 15px;
    border: 1px solid #ddd;
}

.btn-primary {
    background-color: #333;
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    width: 100%;
    margin-top: 10px;
}

.btn-primary:hover {
    background-color: #555;
}

.social-buttons a {
    text-decoration: none;
    display: inline-block;
    width: 50px;
    height: 50px;
    line-height: 50px;
    text-align: center;
    background-color: #f5f5f5;
    border-radius: 50%;
    margin: 0 10px;
    color: #666;
    font-size: 1.5rem;
    transition: all 0.3s;
}

.social-buttons a:hover {
    background-color: #333;
    color: #fff;
}

/* Footer Styling */
footer {
    text-align: center;
    padding: 20px;
    background-color: #f9f9f9;
    font-size: 0.9rem;
    color: #666;
}

/* Responsive Design */
@media (max-width: 1024px) { /* Tablets */
    .split-container {
        flex-direction: column;
    }

    .left-panel {
        flex: none;
        border-bottom: 1px solid #ddd;
        padding: 20px;
    }

    .right-panel {
        flex: none;
        padding: 20px;
    }

    .left-panel h1 {
        font-size: 3rem;
    }

    .login-wrapper h3 {
        font-size: 1.8rem;
    }
}

@media (max-width: 768px) { /* Phones */
    .left-panel h1 {
        font-size: 2.5rem;
    }

    .left-panel img {
        max-width: 80%;
    }

    .right-panel {
        padding: 15px;
    }

    .form-control {
        font-size: 0.9rem;
        padding: 10px 12px;
    }

    .btn-primary {
        font-size: 0.9rem;
        padding: 10px 15px;
    }

    .social-buttons a {
        width: 40px;
        height: 40px;
        line-height: 40px;
        font-size: 1.2rem;
    }
    .main-nav .menu-trigger {
        position: absolute; /* Make it positionable */
        top: 50%; /* Vertically center in the left panel */
        left: 535px; /* Align slightly inside from the left */
        transform: translateY(-50%); /* Adjust for perfect centering */
        margin-top: 50px;
        margin-left: 0; /* Adjust left alignment */
      }
}

        <div class="split-container">

                <div>
                    <h1>Welcome!</h1>

                <div class="login-wrapper">
                    <h3 style="color: #fe3f40 ;text-align: center">Log in</h3>
                    <form>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email or Username" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" placeholder="Password" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center"><br>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Keep me logged in</label>
                            </div>
                            <a href="#" class="forgot-password" style="color: #fe3f40">Forgot your password?</a>
                        </div><br>
                        <button type="submit" class="btn btn-primary">Log in now</button>
                    </form>
