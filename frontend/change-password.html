    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // DOM Elements
        const accessToken = localStorage.getItem('accessToken'); // Simulate signed-in state
        const signinButton = document.getElementById('signin-button');
        const signupButton = document.getElementById('signup-button');
        const profileDropdown = document.getElementById('profile-dropdown');
        const dropdownToggle = document.querySelector('.dropdown-toggle');
        const dropdownMenu = document.querySelector('.dropdown-menu');
    
        // Ensure dropdown menu starts hidden
        dropdownMenu.classList.remove('show');
    
        // Toggle visibility of profile dropdown and sign-in/up buttons
        if (accessToken) {
            if (signinButton) signinButton.style.display = 'none';
            if (signupButton) signupButton.style.display = 'none';
            if (profileDropdown) profileDropdown.style.display = 'block';
        } else {
            if (profileDropdown) profileDropdown.style.display = 'none';
        }
    
        // Add event listener for dropdown toggle
        if (dropdownToggle) {
            dropdownToggle.addEventListener('click', (event) => {
                event.stopPropagation(); // Prevent event propagation
                dropdownMenu.classList.toggle('show'); // Toggle 'show' class
            });
        }
    
        // Close dropdown when clicking outside
        document.addEventListener('click', (event) => {
            if (!dropdownMenu.contains(event.target) && !dropdownToggle.contains(event.target)) {
                dropdownMenu.classList.remove('show'); // Remove 'show' class
            }
        });
    });
    
    </script>
