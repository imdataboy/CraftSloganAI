<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Menu</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: "Poppins", Arial, sans-serif;
            background: linear-gradient(120deg, #f9f9f9, #ffffff);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header-area {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 15px 0;
        }

        .header-area .logo img {
            max-width: 130px;
        }

        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Vertically centers content */
            padding: 0px 10px;
        }

        .main-nav .logo img {
            max-width: 130px;
        }

        .nav {
            font-family: 'Poppins', Arial, sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav a {
            text-decoration: none;
            color: inherit;
            transition: color 0.3s ease;
        }

        .nav a:hover {
            color: #fe3f40;
        }

        .main-red-buttons {
            display: flex;
            gap: 10px;
        }

        .main-red-button a {
            display: inline-block;
            background-color: #fe3f40;
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            text-transform: capitalize;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .main-red-button a:hover {
            background-color: #333;
        }

        .menu-container {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .menu-item {
            width: 220px;
            height: 220px;
            background: white;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            text-align: center;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid #ccc;
        }

        .menu-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        }

        .menu-item i {
            font-size: 3rem;
            color: #fe3f40;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        .menu-item span {
            font-size: 1.3rem;
            font-weight: bold;
        }

        footer {
            padding: 20px;
            text-align: center;
            background: #ffffff;
            color: rgb(0, 0, 0);
            margin-top: auto;
        }

        footer a {
            color: #fe3f40;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        /* Hide dropdown menu by default */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            background-color: #fff;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            padding: 10px 0;
            border-radius: 5px;
            z-index: 1000;
        }
        .dropdown-menu.show {
            display: block; /* Show dropdown when .show class is added */
        }

        .dropdown-item {
            color: #333;
            padding: 8px 15px;
            font-size: 14px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .dropdown-item:hover {
            background-color: #f8f8f8;
            color: #fe3f40;
        }

        .dropdown-toggle {
            cursor: pointer;
        }

        .fas.fa-user-circle {
            display: inline-block;
            vertical-align: middle;
        }

        /* Default dropdown menu styles */
        .dropdown-menu {
          display: none; /* Hidden by default */
          position: absolute;
          top: 100%; /* Align under the button */
          right: 0;
          background-color: #fff;
          box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
          padding: 10px 0;
          border-radius: 5px;
          z-index: 1000;
        }

        .dropdown-menu.show {
          display: block; /* Visible when toggled */
        }

        .dropdown-item {
          color: #333;
          padding: 8px 15px;
          font-size: 14px;
          text-decoration: none;
          transition: background-color 0.3s ease;
        }

        .dropdown-item:hover {
          background-color: #f8f8f8;
          color: #fe3f40;
        }

        .dropdown-menu {
          display: none;
          position: absolute;
          right: 0;
          background-color: #fff;
          box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
          padding: 10px 0;
          border-radius: 5px;
          z-index: 1000;
          opacity: 0;
          transition: opacity 0.3s ease-in-out;
        }

        .dropdown-menu.show {
          display: block;
          opacity: 1;
        }
    </style>
<script src="js/api.js"></script>
</head>

<body>

    <!-- Header Area Start -->
    <header class="header-area">
        <div class="container">
            <nav class="main-nav">
                <a href="index.html" class="logo">
                    <img src="assets/fonts/log.png" alt="Logo">
                </a>
                <ul class="nav">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="menuPage.html">Menu</a></li>
                    <li><a href="Post.html">Tutorial</a></li>
                    <li><a href="run.html">Run Agents</a></li>
                    <li><a href="draft.html">Draft</a></li>
                </ul>
              
              
              
               <div class="main-red-buttons">
                <div class="main-red-button" id="signin-button">
                    <a href="signin.html">Sign In</a>
                </div>
                <div class="main-red-button" id="signup-button">
                    <a href="signup.html">Sign Up</a>
                </div>
            </div>
            
            <div class="dropdown" id="profile-dropdown" style="display: none;">
              <!-- Profile Icon -->
              <button class="btn dropdown-toggle" type="button" id="dropdownMenuButton" style="background: none; border: none; padding: 0; cursor: pointer;">
                  <i class="fas fa-user-circle fa-2x" style="color: #333;"></i>
              </button>
          
              <!-- Dropdown Menu -->
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
                  <li><a class="dropdown-item" href="draft.html">Draft</a></li>
                  <li><a class="dropdown-item" href="change-password.html">Change Password</a></li>
                  <li><a class="dropdown-item" href="#" onclick="signOut()">Sign Out</a></li>
              </ul>
          </div>
          
            
            </nav>
        </div>
    </header>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // DOM Elements
        const accessToken = localStorage.getItem('accessToken'); // Simulate signed-in state
        const signinButton = document.getElementById('signin-button');
        const signupButton = document.getElementById('signup-button');
        const profileDropdown = document.getElementById('profile-dropdown');
        const dropdownToggle = document.querySelector('.dropdown-toggle');
        const dropdownMenu = document.querySelector('.dropdown-menu');
    
        // Ensure dropdown menu starts hidden
        dropdownMenu.classList.remove('show');
    
        // Toggle visibility of profile dropdown and sign-in/up buttons
        if (accessToken) {
            if (signinButton) signinButton.style.display = 'none';
            if (signupButton) signupButton.style.display = 'none';
            if (profileDropdown) profileDropdown.style.display = 'block';
        } else {
            if (profileDropdown) profileDropdown.style.display = 'none';
        }
    
        // Add event listener for dropdown toggle
        if (dropdownToggle) {
            dropdownToggle.addEventListener('click', (event) => {
                event.stopPropagation(); // Prevent event propagation
                dropdownMenu.classList.toggle('show'); // Toggle 'show' class
            });
        }
    
        // Close dropdown when clicking outside
        document.addEventListener('click', (event) => {
            if (!dropdownMenu.contains(event.target) && !dropdownToggle.contains(event.target)) {
                dropdownMenu.classList.remove('show'); // Remove 'show' class
            }
        });
    });
    
    </script>

    <div class="menu-container">
        <div class="menu-item" onclick="navigateTo('Post.html')">
            <i class="fas fa-book"></i>
            <span>Tutorial</span>
        </div>
        <div class="menu-item" onclick="navigateTo('gmail.html')">
            <i class="fas fa-link"></i>
            <span>Connect</span>
        </div>
        <div class="menu-item" onclick="navigateTo('run.html')">
            <i class="fas fa-robot"></i>
            <span>Run Agents</span>
        </div>
        <div class="menu-item" onclick="navigateTo('draft.html')">
            <i class="fas fa-pencil-alt"></i>
            <span>Draft</span>
        </div>
        <div class="menu-item" onclick="navigateTo('CraftBot.html')">
            <i class="fas fa-cogs"></i>
            <span>CraftBot</span>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025. All Rights Reserved.<br><a href="#">SloganCraftAI</a></p>
        </div>
    </footer>

    <script>
        function navigateTo(page) {
            window.location.href = page;
        }
    </script>
</body>

</html>
